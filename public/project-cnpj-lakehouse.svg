<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Terminal simulando a execução do lakehouse de dados de CNPJ">
  <rect width="800" height="450" fill="#0b1210"/>

  <g opacity="0.07" fill="none" stroke="#2DD4BF" stroke-width="10">
    <circle cx="645" cy="145" r="145"/>
    <circle cx="725" cy="335" r="105"/>
  </g>

  <text x="40" y="52" font-family="'JetBrains Mono','Courier New',monospace" font-size="16" fill="#5f6b66">~/cnpj-lakehouse-spark-airflow</text>
  <line x1="40" y1="68" x2="760" y2="68" stroke="#1c2622" stroke-width="1.5"/>

  <text font-family="'JetBrains Mono','Courier New',monospace" font-size="22" fill="#e8f5ee">
    <tspan x="40" y="118"><tspan fill="#2DD4BF">$</tspan> airflow dags trigger cnpj_bronze</tspan>
    <tspan x="40" y="164" fill="#8a9a94">&gt; [bronze] WebDAV: 6 tabelas + Empresas</tspan>
    <tspan x="40" y="210" fill="#8a9a94">&gt; [bronze] checksum OK (idempotente)</tspan>
    <tspan x="40" y="256"><tspan fill="#2DD4BF">$</tspan> spark-submit bronze_to_silver.py</tspan>
    <tspan x="40" y="302" fill="#8a9a94">&gt; [silver] reconstrução de CNPJ</tspan>
    <tspan x="40" y="348" fill="#2DD4BF">✓ Delta Lake (MinIO): partição gravada</tspan>
  </text>

  <rect x="552" y="334" width="14" height="24" fill="#2DD4BF"/>
</svg>
