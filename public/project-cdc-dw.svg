<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Terminal simulando a execução da pipeline de CDC do SQL Server para o data warehouse">
  <rect width="800" height="450" fill="#0b1210"/>

  <g opacity="0.07" fill="none" stroke="#5B9DFF" stroke-width="10">
    <circle cx="650" cy="140" r="140"/>
    <circle cx="730" cy="340" r="100"/>
  </g>

  <text x="40" y="52" font-family="'JetBrains Mono','Courier New',monospace" font-size="16" fill="#5f6b66">~/sqlserver-cdc-to-dw</text>
  <line x1="40" y1="68" x2="760" y2="68" stroke="#1c2622" stroke-width="1.5"/>

  <text font-family="'JetBrains Mono','Courier New',monospace" font-size="22" fill="#e8f5ee">
    <tspan x="40" y="118"><tspan fill="#5B9DFF">$</tspan> cdc_pipeline.py status</tspan>
    <tspan x="40" y="164" fill="#8a9a94">&gt; CDC ativo em 5 tabelas (LSN watermark)</tspan>
    <tspan x="40" y="210"><tspan fill="#5B9DFF">$</tspan> cdc_pipeline.py run</tspan>
    <tspan x="40" y="256" fill="#8a9a94">&gt; SCD2: dim_cliente +128, dim_produto +12</tspan>
    <tspan x="40" y="302" fill="#8a9a94">&gt; Fato: 4.532 linhas neste ciclo</tspan>
    <tspan x="40" y="348" fill="#5B9DFF">✓ Qualidade: 0 problemas CRITICOS</tspan>
  </text>

  <rect x="486" y="334" width="14" height="24" fill="#5B9DFF"/>
</svg>
