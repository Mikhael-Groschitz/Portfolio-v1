<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Painel estilo Power BI com preços médios de combustíveis da ANP">
  <rect width="800" height="450" fill="#F3F2F1"/>

  <rect width="800" height="56" fill="#FFFFFF"/>
  <line x1="0" y1="56" x2="800" y2="56" stroke="#E1DFDD" stroke-width="1"/>
  <text x="24" y="34" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#252423">Preços de Combustíveis — ANP</text>
  <text x="640" y="34" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#605E5C" text-anchor="end">Painel · dados 2005–2026</text>

  <!-- KPI cards -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <rect x="24" y="72" width="228" height="76" rx="6" fill="#FFFFFF" stroke="#E1DFDD"/>
    <text x="40" y="96" font-size="11" letter-spacing="0.04em" fill="#605E5C">PREÇO MÉDIO NACIONAL</text>
    <text x="40" y="128" font-size="26" font-weight="700" fill="#252423">R$ 5,87</text>

    <rect x="268" y="72" width="228" height="76" rx="6" fill="#FFFFFF" stroke="#E1DFDD"/>
    <text x="284" y="96" font-size="11" letter-spacing="0.04em" fill="#605E5C">POSTOS MONITORADOS</text>
    <text x="284" y="128" font-size="26" font-weight="700" fill="#252423">8.942</text>

    <rect x="512" y="72" width="228" height="76" rx="6" fill="#FFFFFF" stroke="#E1DFDD"/>
    <text x="528" y="96" font-size="11" letter-spacing="0.04em" fill="#605E5C">PERÍODO ANALISADO</text>
    <text x="528" y="128" font-size="26" font-weight="700" fill="#252423">2005–2026</text>
  </g>

  <!-- Bar chart -->
  <rect x="24" y="164" width="366" height="262" rx="6" fill="#FFFFFF" stroke="#E1DFDD"/>
  <text x="40" y="188" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" fill="#252423">Preço médio por combustível (R$/L)</text>

  <g stroke="#EDEBE9" stroke-width="1">
    <line x1="40" y1="220" x2="374" y2="220"/>
    <line x1="40" y1="268" x2="374" y2="268"/>
    <line x1="40" y1="316" x2="374" y2="316"/>
    <line x1="40" y1="364" x2="374" y2="364"/>
  </g>
  <line x1="40" y1="410" x2="374" y2="410" stroke="#C8C6C4" stroke-width="1.5"/>

  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <rect x="55" y="228" width="52" height="182" fill="#F2C811"/>
    <text x="81" y="220" font-size="12" font-weight="600" fill="#252423" text-anchor="middle">5,87</text>
    <text x="81" y="426" font-size="11" fill="#605E5C" text-anchor="middle">Gasolina</text>

    <rect x="145" y="288" width="52" height="122" fill="#01B8AA"/>
    <text x="171" y="280" font-size="12" font-weight="600" fill="#252423" text-anchor="middle">3,92</text>
    <text x="171" y="426" font-size="11" fill="#605E5C" text-anchor="middle">Etanol</text>

    <rect x="235" y="220" width="52" height="190" fill="#374649"/>
    <text x="261" y="212" font-size="12" font-weight="600" fill="#252423" text-anchor="middle">6,12</text>
    <text x="261" y="426" font-size="11" fill="#605E5C" text-anchor="middle">Diesel</text>

    <rect x="325" y="275" width="52" height="135" fill="#FE9666"/>
    <text x="351" y="267" font-size="12" font-weight="600" fill="#252423" text-anchor="middle">4,35</text>
    <text x="351" y="426" font-size="11" fill="#605E5C" text-anchor="middle">GNV</text>
  </g>

  <!-- Line chart -->
  <rect x="410" y="164" width="366" height="262" rx="6" fill="#FFFFFF" stroke="#E1DFDD"/>
  <text x="426" y="188" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" fill="#252423">Evolução do preço médio (R$/L)</text>

  <g stroke="#EDEBE9" stroke-width="1">
    <line x1="426" y1="220" x2="760" y2="220"/>
    <line x1="426" y1="268" x2="760" y2="268"/>
    <line x1="426" y1="316" x2="760" y2="316"/>
    <line x1="426" y1="364" x2="760" y2="364"/>
  </g>
  <line x1="426" y1="410" x2="760" y2="410" stroke="#C8C6C4" stroke-width="1.5"/>

  <path d="M430 410 L430 335.7 L496 322.8 L562 300.2 L628 261.4 L694 235.5 L760 220.4 L760 410 Z" fill="#118DFF" opacity="0.12"/>
  <path d="M430 335.7 L496 322.8 L562 300.2 L628 261.4 L694 235.5 L760 220.4" fill="none" stroke="#118DFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#118DFF">
    <circle cx="430" cy="335.7" r="4"/>
    <circle cx="496" cy="322.8" r="4"/>
    <circle cx="562" cy="300.2" r="4"/>
    <circle cx="628" cy="261.4" r="4"/>
    <circle cx="694" cy="235.5" r="4"/>
    <circle cx="760" cy="220.4" r="4"/>
  </g>

  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#605E5C" text-anchor="middle">
    <text x="430" y="426">2005</text>
    <text x="562" y="426">2015</text>
    <text x="694" y="426">2023</text>
  </g>
</svg>
